server {
    listen 80;
    server_name localhost;

    # Serve the React SPA under the /student/ base path.
    # The top-level reverse proxy forwards /student/* here with the full path intact,
    # so we use alias to map /student/ → /usr/share/nginx/html/.
    location /student/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /student/index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
