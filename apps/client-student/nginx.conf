server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached so browsers always get the latest
    # asset fingerprints after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Hashed assets (JS/CSS/images) are immutable — cache them for 1 year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Standard SPA fallback — all unmatched paths serve index.html.
    # The proxy strips /student/ before forwarding, so this container
    # only ever sees root-relative paths (/assets/…, /dashboard, etc.).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
