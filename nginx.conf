# map must live at the http{} level — this file is included inside http{} by
# the default nginx.conf, so placing it here (outside server{}) is correct.
#
# Cloudflare terminates TLS and forwards plain HTTP to this proxy, but it
# always sends X-Forwarded-Proto: https so downstream services know the
# original connection was secure.  We pass that value through unchanged;
# using $scheme would give "http" and break express-session's cookie.secure
# check (it silently drops the session cookie when req.secure is false).
map $http_x_forwarded_proto $real_proto {
    default $scheme;   # direct / non-Cloudflare access: use actual scheme
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;

    # Docker's internal DNS — required so nginx resolves container hostnames
    # at request time rather than at startup (prevents crash when a container
    # hasn't started yet or restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------
    # 1. API → NestJS (strip /api prefix)
    # ------------------------------------
    location /api/ {
        proxy_pass http://server:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
    }

    # ------------------------------------
    # 2. Object storage → MinIO (strip /storage prefix)
    # ------------------------------------
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
    }

    # ------------------------------------
    # 3. Student portal  →  /student/
    # ------------------------------------
    location = /student {
        return 301 /student/;
    }

    location /student/ {
        # Strip the /student/ prefix — client-student serves from root.
        # The trailing slash on the proxy_pass URI is what triggers the rewrite.
        proxy_pass http://client-student:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
    }

    # ------------------------------------
    # 4. Admin client  →  /
    # ------------------------------------
    location / {
        proxy_pass http://client:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
    }
}
