server {
    listen 80;
    server_name _;

    # Cloudflare terminates TLS and forwards HTTP to this proxy, but sends
    # X-Forwarded-Proto: https so that downstream services know the original
    # connection was secure.  We must pass that header through unchanged;
    # using $scheme here would give "http" and break express-session's
    # cookie.secure check (it would silently drop the session cookie).
    map $http_x_forwarded_proto $real_proto {
        default $scheme;
        https   https;
        http    http;
    }

    # ------------------------------------
    # 1. API → NestJS (strip /api prefix)
    # ------------------------------------
    location /api/ {
        proxy_pass http://server:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
    }

    # ------------------------------------
    # 2. Student portal  →  /student/
    # ------------------------------------
    location = /student {
        return 301 /student/;
    }

    location /student/ {
        proxy_pass http://client-student:80/student/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
    }

    # ------------------------------------
    # 3. Admin client  →  /
    # ------------------------------------
    location / {
        proxy_pass http://client:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
    }
}
