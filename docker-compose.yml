services:

  # ------------------------------------
  # 1. DATABASE
  # ------------------------------------
  db:
    container_name: domas_db
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: domas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - domas_net

  # ------------------------------------
  # 2. SERVER
  # ------------------------------------
  server:
    container_name: domas_server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@domas_db:5432/domas
    volumes:
      # mapping for HOT RELOAD
      - ./apps/server/src:/app/apps/server/src
      - ./packages:/app/packages
      # Protect dependencies
      - /app/node_modules
    networks:
      - domas_net
    depends_on:
      - db

  # ------------------------------------
  # 3. STUDENT CLIENT
  # ------------------------------------
  client-student:
    container_name: domas_student
    build:
      context: .
      dockerfile: apps/client-student/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./apps/client-student/src:/app/apps/client-student/src
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - domas_net

  # ------------------------------------
  # 4. MAIN CLIENT (ADMIN)
  # ------------------------------------
  client:
    container_name: domas_client
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "5174:5174"
    volumes:
      - ./apps/client/src:/app/apps/client/src
      - ./packages:/app/packages
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - domas_net
    depends_on:
      - server

networks:
  domas_net:
    driver: bridge

volumes:
  postgres_data: