services:

  # ------------------------------------
  # 1. DATABASE
  # ------------------------------------
  db:
    container_name: domas_db
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: domas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - domas_net

  # ------------------------------------
  # 2. MINIO (Object Storage)
  # ------------------------------------
  minio:
    container_name: domas_minio
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - domas_net

  # ------------------------------------
  # 3. SERVER
  # ------------------------------------
  server:
    container_name: domas_server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@domas_db:5432/domas
      - STORAGE_ENDPOINT=http://domas_minio:9000
      - STORAGE_REGION=us-east-1
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=domas-files
    volumes:
      # mapping for HOT RELOAD
      - ./apps/server/src:/app/apps/server/src
      - ./packages:/app/packages
      # Protect dependencies
      - /app/node_modules
    networks:
      - domas_net
    depends_on:
      - db
      - minio

  # ------------------------------------
  # 4. STUDENT CLIENT
  # ------------------------------------
  client-student:
    container_name: domas_student
    build:
      context: .
      dockerfile: apps/client-student/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./apps/client-student/src:/app/apps/client-student/src
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - domas_net

  # ------------------------------------
  # 5. MAIN CLIENT (ADMIN)
  # ------------------------------------
  client:
    container_name: domas_client
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "5174:5174"
    volumes:
      - ./apps/client/src:/app/apps/client/src
      - ./packages:/app/packages
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - domas_net
    depends_on:
      - server

networks:
  domas_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data: