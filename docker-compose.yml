services:

  # ------------------------------------
  # 1. DATABASE
  # ------------------------------------
  db:
    container_name: domas_db
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: domas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - domas_net

  # ------------------------------------
  # 2. MINIO (Object Storage)
  # ------------------------------------
  minio:
    container_name: domas_minio
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - domas_net

  # ------------------------------------
  # 3. SERVER
  # ------------------------------------
  server:
    container_name: domas_server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/domas
      - SESSION_SECRET=fee30131828e46e3a2dc70ede1d65251ab342a4d3781c52fdd508191a0f28ea5
      - APP_USER=domas_app
      - APP_USER_PASSWORD=domas_app_pass
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      - STORAGE_REGION=us-east-1
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=domas-files
    networks:
      - domas_net
    depends_on:
      - db
      - minio

  # ------------------------------------
  # 4. ADMIN CLIENT
  # ------------------------------------
  client:
    container_name: domas_client
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_URL: "/api"
    restart: always
    networks:
      - domas_net
    depends_on:
      - server

  # ------------------------------------
  # 5. STUDENT CLIENT
  # ------------------------------------
  client-student:
    container_name: domas_student
    build:
      context: .
      dockerfile: apps/client-student/Dockerfile
      args:
        VITE_API_URL: "/api"
        VITE_BASE_URL: "/student/"
    restart: always
    networks:
      - domas_net
    depends_on:
      - server

  # ------------------------------------
  # 6. REVERSE PROXY  (single entry point)
  # ------------------------------------
  proxy:
    container_name: domas_proxy
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - domas_net
    depends_on:
      - client
      - client-student
      - server

networks:
  domas_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
